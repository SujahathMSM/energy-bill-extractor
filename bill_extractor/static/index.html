<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Extractor</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2328; --muted: #59636e; --line: #d8dee4;
    --accent: #0f766e; --pass: #1a7f37; --pass-bg: #dafbe1; --fail: #b42318; --fail-bg: #ffebe9;
    --skip: #6e7781; --skip-bg: #eef1f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #9198a1; --line: #30363d;
      --accent: #2dd4bf; --pass: #3fb950; --pass-bg: #12261e; --fail: #ff7b72; --fail-bg: #2d1416;
      --skip: #9198a1; --skip-bg: #21262d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .drop { border: 1.5px dashed var(--line); border-radius: 12px; background: var(--panel);
          padding: 28px; text-align: center; cursor: pointer; transition: border-color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); }
  .drop input { display: none; }
  .status { margin: 16px 0; color: var(--muted); min-height: 1.5em; }
  .banner { border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-weight: 600; }
  .banner.ok { background: var(--pass-bg); color: var(--pass); }
  .banner.review { background: var(--fail-bg); color: var(--fail); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card .k { font-size: 12px; color: var(--muted); }
  .card .v { font-size: 16px; font-weight: 600; word-break: break-word; }
  h2 { font-size: 15px; margin: 24px 0 8px; }
  .checks { list-style: none; padding: 0; margin: 0; }
  .checks li { display: flex; gap: 10px; align-items: baseline; padding: 8px 0;
               border-bottom: 1px solid var(--line); }
  .pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; flex: none; }
  .pill.pass { background: var(--pass-bg); color: var(--pass); }
  .pill.fail { background: var(--fail-bg); color: var(--fail); }
  .pill.skipped { background: var(--skip-bg); color: var(--skip); }
  .checks .name { font-weight: 600; flex: none; }
  .checks .detail { color: var(--muted); }
  details { margin-top: 20px; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        padding: 12px; overflow-x: auto; font-size: 12.5px; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Electricity bill extractor</h1>
  <p class="sub">Drop a bill (PDF or photo). A vision model reads it; code checks the numbers add up.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="application/pdf,image/png,image/jpeg,image/webp">
    <strong>Choose a bill</strong> or drop it here
  </label>
  <div class="status" id="status"></div>
  <section id="result" hidden></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), input = $("file"), statusEl = $("status"), resultEl = $("result");

const esc = (s) => String(s ?? "—").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (v, cur) => v == null ? "—" : `${v.toFixed(2)} ${cur ?? ""}`.trim();

["dragenter", "dragover"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((e) => drop.addEventListener(e, (ev) => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (ev) => ev.dataTransfer.files[0] && upload(ev.dataTransfer.files[0]));
input.addEventListener("change", () => input.files[0] && upload(input.files[0]));

async function upload(file) {
  resultEl.hidden = true;
  statusEl.textContent = `Reading ${file.name}…`;
  const body = new FormData();
  body.append("file", file);
  try {
    const res = await fetch("/v1/bills/extract", { method: "POST", body });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    statusEl.textContent = "";
    render(data);
  } catch (err) {
    statusEl.textContent = `Could not read the bill: ${err.message}`;
  }
}

function render(r) {
  const x = r.extraction, d = r.derived, cur = d.currency;
  const rates = d.unit_rates.map((u) =>
    `${esc(u.label || "Rate")}: ${u.per_kwh == null ? "?" : u.per_kwh.toFixed(4)} ${esc(cur)}/kWh`).join("<br>");
  const cards = [
    ["Supplier", esc(x.supplier_name)],
    ["Tariff", esc(x.tariff_name)],
    ["Supply number", esc(x.meter_point_id)],
    ["Period", `${esc(x.billing_period_start)} → ${esc(x.billing_period_end)}${d.period_days ? ` (${d.period_days} days)` : ""}`],
    ["Used", x.consumption_kwh == null ? "—" : `${x.consumption_kwh} kWh`],
    ["Unit rates", rates || "—"],
    ["Standing charge", d.standing_charge_per_day == null ? "—" : `${d.standing_charge_per_day.toFixed(4)} ${esc(cur)}/day`],
    ["Total this period", money(x.total_amount, cur)],
    ["Estimated annual use", d.estimated_annual_kwh == null ? "—" : `${d.estimated_annual_kwh} kWh`],
  ];
  const banner = r.needs_review
    ? `<div class="banner review">Needs review: ${r.review_reasons.length} check(s) failed</div>`
    : `<div class="banner ok">All checks passed</div>`;
  resultEl.innerHTML = `
    ${banner}
    <div class="grid">${cards.map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    <h2>Checks</h2>
    <ul class="checks">${r.checks.map((c) =>
      `<li><span class="pill ${c.status}">${c.status}</span><span class="name">${esc(c.name)}</span><span class="detail">${esc(c.detail)}</span></li>`).join("")}</ul>
    <p class="meta">${esc(r.meta.backend)} · ${esc(r.meta.model)} · ${r.meta.latency_ms} ms · ${r.meta.attempts} attempt(s) · ${r.meta.pages_sent} page(s)</p>
    <details><summary>Raw response</summary><pre>${esc(JSON.stringify(r, null, 2))}</pre></details>`;
  resultEl.hidden = false;
}
</script>
</body>
</html>
