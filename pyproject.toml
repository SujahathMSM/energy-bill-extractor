[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-bill-extractor"
version = "0.1.0"
description = "Extract tariff and usage fields from electricity bills with a vision-language model, behind FastAPI, with plausibility checks and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "M.S. Mohamed Sujahath" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pillow>=10.3",
  "pypdfium2>=4.30",
  "reportlab>=4.2",
  "anthropic>=1.15",
  "openai>=3.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["bill_extractor*"]

[tool.setuptools.package-data]
bill_extractor = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
