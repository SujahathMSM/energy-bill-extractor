name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t energy-bill-extractor:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e BILLX_BACKEND=mock energy-bill-extractor:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -F "file=@samples/bill_000.pdf" localhost:8000/v1/bills/extract | python -m json.tool | head -20
          docker rm -f api
